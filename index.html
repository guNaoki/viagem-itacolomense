    <!-- tela de carregamento: CSS aqui mesmo pra aparecer antes de qualquer JavaScript -->
    <style>
      #loader {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: linear-gradient(#fffdf7, #fff1d6); color: #1c1917;
        transition: opacity .6s ease, visibility .6s, transform .8s cubic-bezier(.22,1,.36,1);
      }
      #loader.is-done { opacity: 0; visibility: hidden; transform: translateY(-3%); }
      .ld { display: grid; justify-items: center; gap: 14px; }
      .ld__scene { position: relative; width: 132px; height: 74px; overflow: hidden; }
      .ld__sun {
        position: absolute; left: 50%; bottom: -46px; width: 92px; height: 92px; margin-left: -46px; border-radius: 50%;
        background: repeating-linear-gradient(180deg, #f59e0b 0 60%, #fde68a 60% 66%, #f59e0b 66% 74%, #fde68a 74% 79%, #f59e0b 79% 100%);
        animation: ld-rise 1.6s cubic-bezier(.45,0,.2,1) infinite alternate;
      }
      .ld__line { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 3px; background: #10b981; }
      .ld__mark { font: italic 700 26px/1 'Fraunces', Georgia, serif; letter-spacing: -.03em; }
      .ld__mark i { color: #10b981; font-style: normal; }
      .ld__note { font: 600 20px/1 'Caveat', 'Segoe Script', cursive; color: #047857; transform: rotate(-2deg); }
      .ld__dots::after { content: ''; animation: ld-dots 1.2s steps(4) infinite; }
      @keyframes ld-rise { from { transform: translateY(0); } to { transform: translateY(-34px); } }
      @keyframes ld-dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
      @media (prefers-reduced-motion: reduce) { .ld__sun, .ld__dots::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-label="Carregando">
      <div class="ld">
        <div class="ld__scene" aria-hidden="true"><span class="ld__sun"></span><span class="ld__line"></span></div>
        <div class="ld__mark">jan<i>/</i>27</div>
        <div class="ld__note"><span class="ld__dots">arrumando as malas</span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
